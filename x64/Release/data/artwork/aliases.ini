; Overlay aliases: which artwork file (name without .png, in this folder) a
; cartridge uses when it can't be found automatically.
;
; When a cart loads, the overlay is looked up in this order:
;   1. <rom filename>.png here, then <rom path>.png beside the ROM
;   2. [crc32] below: the cart image's CRC32
;   3. [title] below: the title in the cart header
;   4. an artwork file named like the title ("FORTRESS / OF / NARZOD" finds
;      Fortress_of_Narzod.png: case, spaces and punctuation are ignored)
; Titles are tried whole, then first line only. The log shows each cart's
; title and CRC32 ("CART title: ... crc32=...") to copy into this file.
;
; Example entries:
;   [title]
;   Star Trek - The Game = startrek
;   [crc32]
;   825987E3 = Vaders

[title]

[crc32]
; Vector Vaders (John Dondzila, 1996): its header "title" is a message.
825987E3 = Vaders
